name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build app
        run: pnpm build
        env:
          VITE_BASE: "/${{ github.event.repository.name }}/app/"

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/app _site/workshop
          cp -a docs/. _site/
          cp -a dist/. _site/app/
          cp -a workshop/. _site/workshop/
          test -f _site/index.html
          test -f _site/app/index.html
          test -f _site/workshop/GUIDE.md
          grep -Fq "/${{ github.event.repository.name }}/app/assets/" _site/app/index.html
          test -n "$(find _site/app/assets -type f -name '*.js' -print -quit)"
          test -n "$(find _site/app/assets -type f -name '*.css' -print -quit)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4